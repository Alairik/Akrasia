name: Deploy to FTP

on:
  push:
    branches:
      - claude/akrasia-website-setup-etol2

jobs:
  deploy:
    name: Deploy to Wedos FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Root /www/.htaccess spravuje výhradně Zvelebil-web repo.
      # Akrasia NESMÍ přepisovat root .htaccess – způsobuje to ztrátu
      # subdomain alias pravidel a rozbití ostatních projektů na serveru.

      - name: Upload Akrasia files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /www/akrasia/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            _server/**
            uploads/**
            Akrasia/**
            CLAUDE.md
